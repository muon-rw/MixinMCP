# MixinMCP Plugin Configuration

# IntelliJ Platform Plugin Template settings
pluginGroup = dev.mixinmcp
pluginName = MixinMCP
pluginRepositoryUrl = https://github.com/muon-rw/MixinMCP
# SemVer: https://semver.org
pluginVersion = 1.4.0

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 262 floor: McpToolset.isExperimental()/alwaysIncluded() are 2026.2+ API, and Kotlin emits a
# compatibility bridge for every inherited interface default, so a 261 runtime would NoSuchMethodError.
pluginSinceBuild = 262
# Leave untilBuild unset for compatibility with future versions
#pluginUntilBuild = 262.*

# IntelliJ Platform Properties
platformType = IC
platformVersion = 2026.2

# Plugin Dependencies
platformPlugins =
platformBundledPlugins = com.intellij.java,com.intellij.mcpServer,com.intellij.gradle,org.jetbrains.plugins.gradle
platformBundledModules =

# Gradle
gradleVersion = 9.6.1
org.gradle.configuration-cache = true
org.gradle.caching = true

# Opt-out flag for bundling Kotlin standard library
kotlin.stdlib.default.dependency = false
